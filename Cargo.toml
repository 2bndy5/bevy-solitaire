[package]
name = "bevy-solitaire"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "0.20.0" }
rand = "0.10.1"

[target.wasm32-unknown-unknown.dependencies]
# spell-checker: disable-next-line 
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# Saving settings and games in the browser's local storage, and opening links.
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- Without this, mobile browsers lay the page out ~980px wide and scale it down,
       which pushed the menu's "Start Game" button off the canvas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Solitaire</title>
  <style>
    /* Give the canvas's parent a definite size so `fit_canvas_to_parent` fills the screen. */
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      /* Let the game handle touch drags instead of the browser scrolling or zooming. */
      touch-action: none;
    }
  </style>
</head>

<body>
  <script type="module">
    import './restart-audio-context.js'
    import init from './bevy_game.js'

    init().catch((error) => {
      if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
        throw error;
      }
    });
  </script>
</body>

</html>
